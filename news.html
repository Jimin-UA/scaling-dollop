<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — Green-vector</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --green-primary: #2e7d32;
            --green-dark: #1b5e20;
            --green-light: #e8f5e9;
            --gray-text: #424242;
            --white: #ffffff;
            --gray-background: #f5f5f5;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--gray-text);
            background-color: var(--white);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            background-color: var(--gray-background);
            padding: 20px 0;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 60px;
        }

        .nav-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 25px;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--gray-text);
            font-weight: 600;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 2px;
            background-color: var(--green-primary);
            transition: width 0.3s ease;
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        /* Стиль для главной секции-заглушки */
        .coming-soon-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 180px); /* Вычисляем высоту экрана без шапки и подвала */
            text-align: center;
        }

        .typing-container {
            font-family: 'Open Sans', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--green-dark);
            position: relative;
            white-space: nowrap; /* Запрещает перенос строки... */
            overflow: hidden; /* Скрывает текст, который ещё не напечатан */
            animation: typing-width 3s steps(27, end) forwards; /* Анимация ширины контейнера */
        }

        .typing-container::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 2px;
            background-color: var(--green-dark);
            animation: blink-caret 0.75s step-end infinite; /* Анимация мигающего курсора */
        }

        /* Анимация ширины для эффекта печатания */
        @keyframes typing-width {
            from { width: 0; }
            to { width: 100%; }
        }

        /* Анимация мигающего курсора */
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--green-dark); }
        }

        footer {
            background-color: var(--green-dark);
            color: var(--white);
            padding: 60px 0;
            text-align: center;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        
        .footer-logo img {
            height: 100px;
        }

        .social-links a {
            color: var(--white);
            font-size: 1.8rem;
            margin: 0 15px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: var(--green-light);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <img src="Монтажная область 12.png" alt="Логотип Green-vector">
                </div>
                <div class="nav-menu">
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="we.html">О нас</a></li>
                        <li><a href="Initiative.html">Инициативы</a></li>
                        <li><a href="news.html">Новости</a></li>
                        <li><a href="help.html">Как помочь</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="coming-soon-section">
            <div class="container">
                <p class="typing-container">Эта страница будет скоро обновлена!</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="rose.png" alt="Роза Лютера">
                </div>
                <div class="footer-links">
                    <p>
                        <a href="we.html" style="color: var(--white); text-decoration: none;">О нас</a> | 
                        <a href="#" style="color: var(--white); text-decoration: none;">Контакты</a> | 
                        <a href="#" style="color: var(--white); text-decoration: none;">Политика конфиденциальности</a>
                    </p>
                </div>
                <div class="social-links">
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                </div>
                <p>&copy; 2025 Green-vector. Все права защищены.</p>
            </div>
        </div>
    </footer>

</body>
</html>
